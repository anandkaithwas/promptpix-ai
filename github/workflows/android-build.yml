name: Build Aura Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Cache Prebuilt MNN Android Library (arm64-v8a)
        id: cache-mnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/mnn
          key: mnn-android-arm64-v2.9.6

      - name: Build Alibaba MNN for Android (arm64-v8a)
        if: steps.cache-mnn.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          git clone --depth 1 --branch 2.9.6 https://github.com /tmp/MNN
          mkdir -p /tmp/MNN/build_android
          cd /tmp/MNN/build_android

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_STL=c++_static \
            -DANDROID_PLATFORM=android-26 \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=OFF \
            -DMNN_BUILD_CONVERTER=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_SEP_BUILD=OFF

          make -j$(nproc)

          mkdir -p "${{ github.workspace }}/app/src/main/cpp/mnn/include"
          mkdir -p "${{ github.workspace }}/app/src/main/cpp/mnn/libs/arm64-v8a"

          cp -r /tmp/MNN/include/MNN "${{ github.workspace }}/app/src/main/cpp/mnn/include/"
          cp /tmp/MNN/build_android/libMNN.so "${{ github.workspace }}/app/src/main/cpp/mnn/libs/arm64-v8a/"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Aura Studio Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14